<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020A06"/>
      <stop offset="0.28" stop-color="#06150D"/>
      <stop offset="0.62" stop-color="#092117"/>
      <stop offset="1" stop-color="#102F20"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(917 112) rotate(90) scale(150)">
      <stop stop-color="#D9F99D" stop-opacity="0.22"/>
      <stop offset="0.42" stop-color="#86EFAC" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#86EFAC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(575 238) rotate(90) scale(210 430)">
      <stop stop-color="#22C55E" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BBF7D0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#BBF7D0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#BBF7D0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ECFCCB"/>
      <stop offset="0.35" stop-color="#A3E635"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="title" x1="390" y1="135" x2="810" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FEE7"/>
      <stop offset="0.5" stop-color="#DCFCE7"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="11" r="0.7" fill="#BBF7D0" fill-opacity="0.08"/>
      <circle cx="28" cy="33" r="0.5" fill="#BBF7D0" fill-opacity="0.06"/>
      <circle cx="43" cy="18" r="0.4" fill="#BBF7D0" fill-opacity="0.05"/>
      <path d="M48 0H0V48" stroke="#86EFAC" stroke-opacity="0.025"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="leafGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- atmosphere -->
  <rect width="1200" height="460" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="30" fill="url(#grain)"/>
  <rect width="1200" height="460" rx="30" fill="url(#greenGlow)"/>
  <circle cx="917" cy="112" r="150" fill="url(#moonGlow)"/>
  <circle cx="917" cy="112" r="35" fill="#D9F99D" fill-opacity="0.82"/>
  <circle cx="906" cy="103" r="31" fill="#F7FEE7" fill-opacity="0.9"/>

  <!-- distant mountains -->
  <path d="M0 318L110 237L190 292L285 207L374 306L466 224L558 301L668 197L774 296L888 218L987 298L1090 206L1200 294V460H0V318Z" fill="#06140D" opacity="0.82"/>

  <!-- large trees framing the scene -->
  <g fill="#020A06">
    <path d="M0 460V105L24 158L39 117L53 170L72 126L89 188L111 138L128 198L151 151L174 212L204 184L188 460H0Z"/>
    <path d="M1200 460V92L1178 151L1161 112L1142 174L1124 126L1106 191L1082 139L1064 207L1038 161L1011 215L988 190L1008 460H1200Z"/>
  </g>
  <g fill="#0A2115" opacity="0.92">
    <path d="M42 460V168L58 204L75 169L90 225L108 186L127 244L147 205L160 260L184 221L205 271L218 460H42Z"/>
    <path d="M1158 460V154L1144 199L1129 166L1111 222L1093 184L1075 244L1054 203L1036 265L1017 225L993 282L981 460H1158Z"/>
  </g>

  <!-- foreground ground -->
  <path d="M0 342C175 316 303 361 463 334C638 304 811 366 1200 319V460H0V342Z" fill="#020B07"/>
  <path d="M0 350C200 322 313 370 482 341C657 311 870 371 1200 329" stroke="#1A4D31" stroke-opacity="0.45" stroke-width="2"/>

  <!-- mist bands -->
  <rect x="80" y="286" width="1040" height="3" rx="1.5" fill="url(#mist)" opacity="0.7">
    <animate attributeName="x" values="40;110;40" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect x="170" y="319" width="860" height="2" rx="1" fill="url(#mist)" opacity="0.45">
    <animate attributeName="x" values="130;210;130" dur="11s" repeatCount="indefinite"/>
  </rect>

  <!-- fireflies -->
  <g fill="#D9F99D">
    <circle cx="265" cy="105" r="2"><animate attributeName="opacity" values="0.1;1;0.15" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="332" cy="275" r="1.4"><animate attributeName="opacity" values="0.2;0.85;0.1" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="928" cy="242" r="1.6"><animate attributeName="opacity" values="0.1;1;0.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1016" cy="161" r="1.3"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="792" cy="286" r="1.2"><animate attributeName="cy" values="286;266;286" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="421" cy="243" r="1.3"><animate attributeName="cy" values="243;228;243" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- falling leaves -->
  <g filter="url(#leafGlow)">
    <g transform="translate(145 -22)">
      <path d="M0 0C9 -10 22 -7 22 4C22 15 11 24 0 30C3 17 2 8 0 0Z" fill="url(#leaf)"/>
      <path d="M4 24L17 4" stroke="#166534" stroke-width="1.2" stroke-opacity="0.72"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 210 125; 335 480" dur="8.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="8;135;290" dur="8.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.83;1" dur="8.5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(365 -30)">
      <path d="M0 0C8 -11 21 -8 21 3C21 14 11 22 0 29C2 17 2 8 0 0Z" fill="url(#leaf)"/>
      <path d="M4 23L16 4" stroke="#166534" stroke-width="1.2" stroke-opacity="0.7"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -90 185; 125 480" dur="10.7s" repeatCount="indefinite" begin="1.1s"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="-16;96;250" dur="10.7s" repeatCount="indefinite" begin="1.1s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.84;1" dur="10.7s" repeatCount="indefinite" begin="1.1s"/>
    </g>
    <g transform="translate(660 -28)">
      <path d="M0 0C9 -11 23 -8 23 4C23 15 12 23 0 30C3 17 2 8 0 0Z" fill="url(#leaf)"/>
      <path d="M4 24L17 4" stroke="#166534" stroke-width="1.2" stroke-opacity="0.72"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 120 165; -55 480" dur="9.8s" repeatCount="indefinite" begin="0.7s"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="14;170;328" dur="9.8s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.84;1" dur="9.8s" repeatCount="indefinite" begin="0.7s"/>
    </g>
    <g transform="translate(1045 -25)">
      <path d="M0 0C8 -10 21 -7 21 4C21 14 10 23 0 29C2 17 2 8 0 0Z" fill="url(#leaf)"/>
      <path d="M4 24L16 4" stroke="#166534" stroke-width="1.2" stroke-opacity="0.7"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -155 155; -25 480" dur="11.8s" repeatCount="indefinite" begin="2.1s"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="-12;105;235" dur="11.8s" repeatCount="indefinite" begin="2.1s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.84;1" dur="11.8s" repeatCount="indefinite" begin="2.1s"/>
    </g>
    <g transform="translate(880 -35)">
      <path d="M0 0C7 -9 18 -6 18 4C18 13 9 20 0 25C2 14 1 7 0 0Z" fill="url(#leaf)"/>
      <path d="M3 20L14 4" stroke="#166534" stroke-width="1" stroke-opacity="0.7"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 35 210; 170 480" dur="12.6s" repeatCount="indefinite" begin="3.4s"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="4;145;300" dur="12.6s" repeatCount="indefinite" begin="3.4s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="12.6s" repeatCount="indefinite" begin="3.4s"/>
    </g>
  </g>

  <!-- central glass panel -->
  <rect x="170" y="64" width="860" height="265" rx="28" fill="#03120B" fill-opacity="0.72" stroke="#86EFAC" stroke-opacity="0.20"/>
  <rect x="183" y="77" width="834" height="239" rx="22" fill="none" stroke="#4ADE80" stroke-opacity="0.08" stroke-dasharray="2 10"/>

  <!-- top status line -->
  <text x="205" y="101" fill="#86EFAC" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" letter-spacing="2">RIMM / DIGITAL FOREST</text>
  <text x="995" y="101" text-anchor="end" fill="#86A692" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" letter-spacing="2">SYSTEM // ONLINE</text>

  <!-- crisp title -->
  <text x="600" y="184" text-anchor="middle" fill="url(#title)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="82" font-weight="900" letter-spacing="12">RIMM</text>
  <rect x="405" y="201" width="390" height="2" rx="1" fill="#2F8F46" fill-opacity="0.45"/>
  <rect x="522" y="201" width="156" height="2" rx="1" fill="#A3E635">
    <animate attributeName="x" values="405;639;405" dur="4.6s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="233" text-anchor="middle" fill="#D1FAE5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="3">WEB DEVELOPER · BUILDER · EXPLORER</text>
  <text x="600" y="263" text-anchor="middle" fill="#86EFAC" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">&gt; turning ideas into interactive digital worlds_</text>
  <text x="600" y="286" text-anchor="middle" fill="#BBF7D0" fill-opacity="0.9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">next.js · react · typescript · supabase · node.js · linux</text>

  <!-- bottom metadata -->
  <text x="205" y="305" fill="#4ADE80" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" letter-spacing="1.5">FOREST MODE / 2026</text>
  <text x="995" y="305" text-anchor="end" fill="#4ADE80" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" letter-spacing="1.5">BUILD · SHIP · GROW</text>

  <!-- foreground branches -->
  <g stroke="#0E3A22" stroke-linecap="round" opacity="0.9">
    <path d="M0 62C78 72 90 124 149 135C194 144 199 175 226 205" stroke-width="5"/>
    <path d="M1200 58C1125 74 1113 118 1056 133C1010 145 1003 179 975 207" stroke-width="5"/>
    <path d="M16 98C67 103 94 130 120 165" stroke-width="2.5"/>
    <path d="M1186 96C1138 104 1110 129 1084 164" stroke-width="2.5"/>
  </g>

  <rect x="1" y="1" width="1198" height="458" rx="29" stroke="#1B4D31" stroke-width="2"/>
</svg>
