th="1260" height="350" rx="28" fill="url(#p)" stroke="#4ADE80" stroke-opacity=".16"/><text x="110" y="530" fill="#A3E635" font-family="ui-monospace,monospace" font-size="14" font-weight="700">01 // ABOUT</text><text x="110" y="580" fill="#F0FDF4" font-size="34" font-weight="750">BUILDING THINGS THAT FEEL ALIVE.</text><text x="110" y="625" fill="#B7E4C7" font-size="18">I'm Rimm, a developer from Indonesia with a TKJ / networking &amp; IT background.</text><text x="110" y="655" fill="#B7E4C7" font-size="18">I like going from interface → architecture → database → the messy engineering underneath.</text><rect x="110" y="695" width="1180" height="88" rx="14" fill="#020A06" stroke="#86EFAC" stroke-opacity=".08"/><text x="132" y="726" fill="#86EFAC" font-family="ui-monospace,monospace" font-size="13">FOREST LOG</text><text x="132" y="753" fill="#D1FAE5" font-family="ui-monospace,monospace" font-size="14">learning by shipping · building full-stack products · exploring game systems · tracing root causes</text></g><g><rect x="70" y="880" width="1260" height="400" rx="28" fill="url(#p)" stroke="#4ADE80" stroke-opacity=".16"/><text x="110" y="940" fill="#A3E635" font-family="ui-monospace,monospace" font-size="14" font-weight="700">02 // STACK</text><text x="110" y="990" fill="#F0FDF4" font-size="34" font-weight="750">TOOLS I LIKE TO BUILD WITH.</text><g font-size="16" font-weight="700" text-anchor="middle" fill="#D1FAE5"><g fill="#0D2C1B" stroke="#4ADE80" stroke-opacity=".14"><rect x="110" y="1030" width="170" height="56" rx="14"/><rect x="300" y="1030" width="170" height="56" rx="14"/><rect x="490" y="1030" width="170" height="56" rx="14"/><rect x="680" y="1030" width="170" height="56" rx="14"/><rect x="870" y="1030" width="170" height="56" rx="14"/><rect x="1060" y="1030" width="170" height="56" rx="14"/><rect x="110" y="1110" width="170" height="56" rx="14"/><rect x="300" y="1110" width="170" height="56" rx="14"/><rect x="490" y="1110" width="170" height="56" rx="14"/><rect x="680" y="1110" width="170" height="56" rx="14"/><rect x="870" y="1110" width="170" height="56" rx="14"/><rect x="1060" y="1110" width="170" height="56" rx="14"/></g><text x="195" y="1065">TypeScript</text><text x="385" y="1065">JavaScript</text><text x="575" y="1065">React</text><text x="765" y="1065">Next.js</text><text x="955" y="1065">Tailwind</text><text x="1145" y="1065">Node.js</text><text x="195" y="1145">Supabase</text><text x="385" y="1145">PostgreSQL</text><text x="575" y="1145">Docker</text><text x="765" y="1145">Git</text><text x="955" y="1145">GitHub</text><text x="1145" y="1145">Linux</text></g><text x="110" y="1225" fill="#6FA98A" font-family="ui-monospace,monospace" font-size="14">selected for speed · control · maintainability · learning value</text></g><g><rect x="70" y="1340" width="1260" height="610" rx="28" fill="url(#p)" stroke="#4ADE80" stroke-opacity=".16"/><text x="110" y="1400" fill="#A3E635" font-family="ui-monospace,monospace" font-size="14" font-weight="700">03 // WHAT I BUILD</text><text x="110" y="1450" fill="#F0FDF4" font-size="34" font-weight="750">FROM PRODUCTS TO EXPERIMENTS.</text><g><rect x="110" y="1490" width="575" height="175" rx="20" fill="#061B10" stroke="#4ADE80" stroke-opacity=".14"/><text x="140" y="1535" fill="#D9F99D" font-size="24" font-weight="750">RIMMPAGE</text><text x="140" y="1572" fill="#B7E4C7" font-size="15">Full-stack gaming platform with mini-games, progression,</text><text x="140" y="1598" fill="#B7E4C7" font-size="15">economy, inventory, marketplace, profiles, and tooling.</text><text x="140" y="1635" fill="#86EFAC" font-family="ui-monospace,monospace" font-size="13">NEXT.JS · REACT · TYPESCRIPT · SUPABASE</text></g><g><rect x="715" y="1490" width="575" height="175" rx="20" fill="#061B10" stroke="#4ADE80" stroke-opacity=".14"/><text x="745" y="1535" fill="#D9F99D" font-size="24" font-weight="750">AUTOMATION &amp; TOOLS</text><text x="745" y="1572" fill="#B7E4C7" font-size="15">Bots, APIs, scripts, deployment helpers, and utilities</text><text x="745" y="1598" fill="#B7E4C7" font-size="15">built to remove annoying work and repeatable friction.</text><text x="745" y="1635" fill="#86EFAC" font-family="ui-monospace,monospace" font-size="13">NODE.JS · APIS · LINUX · AUTOMATION</text></g><g><rect x="110" y="1695" width="575" height="175" rx="20" fill="#061B10" stroke="#4ADE80" stroke-opacity=".14"/><text x="140" y="1740" fill="#D9F99D" font-size="24" font-weight="750">WEB EXPERIENCES</text><text x="140" y="1777" fill="#B7E4C7" font-size="15">Responsive interfaces, dashboards, product concepts,</text><text x="140" y="1803" fill="#B7E4C7" font-size="15">and UI systems designed to feel intentional.</text><text x="140" y="1840" fill="#86EFAC" font-family="ui-monospace,monospace" font-size="13">UI · UX · RESPONSIVE · PRODUCT THINKING</text></g><g><rect x="715" y="1695" width="575" height="175" rx="20" fill="#061B10" stroke="#4ADE80" stroke-opacity=".14"/><text x="745" y="1740" fill="#D9F99D" font-size="24" font-weight="750">EXPERIMENTS</text><text x="745" y="1777" fill="#B7E4C7" font-size="15">Prototype an idea, break it, learn from it, then keep</text><text x="745" y="1803" fill="#B7E4C7" font-size="15">the pieces that are actually worth keeping.</text><text x="745" y="1840" fill="#86EFAC" font-family="ui-monospace,monospace" font-size="13">PROTOTYPES · UI EXPERIMENTS · OPEN SOURCE</text></g></g><g><rect x="70" y="2040" width="1260" height="430" rx="28" fill="url(#p)" stroke="#4ADE80" stroke-opacity=".16"/><text x="110" y="2100" fill="#A3E635" font-family="ui-monospace,monospace" font-size="14" font-weight="700">04 // ENGINEERING</text><text x="110" y="2150" fill="#F0FDF4" font-size="34" font-weight="750">TRACE THE ROOT CAUSE.</text><g font-family="ui-monospace,monospace" font-size="14"><text x="120" y="2205" fill="#86EFAC">FRONTEND</text><text x="350" y="2205" fill="#D1FAE5">interactive UI · state · motion · responsive UX</text><text x="120" y="2250" fill="#86EFAC">BACKEND</text><text x="350" y="2250" fill="#D1FAE5">APIs · auth · validation · server logic</text><text x="120" y="2295" fill="#86EFAC">DATABASE</text><text x="350" y="2295" fill="#D1FAE5">PostgreSQL · RPC · RLS · data integrity</text><text x="120" y="2340" fill="#86EFAC">GAME SYSTEMS</text><text x="350" y="2340" fill="#D1FAE5">progression · economy · settlement · concurrency</text><text x="120" y="2385" fill="#86EFAC">TOOLING</text><text x="350" y="2385" fill="#D1FAE5">Git · Docker · Linux · automation · deployment</text><text x="120" y="2430" fill="#86EFAC">MINDSET</text><text x="350" y="2430" fill="#D1FAE5">verify · measure · fix · ship · iterate</text></g></g><g><rect x="70" y="2540" width="1260" height="315" rx="28" fill="#030E08" stroke="#4ADE80" stroke-opacity=".16"/><text x="110" y="2600" fill="#A3E635" font-family="ui-monospace,monospace" font-size="14" font-weight="700">05 // GITHUB FOREST</text><text x="110" y="2650" fill="#F0FDF4" font-size="30" font-weight="750">GROW IN PUBLIC. ONE COMMIT AT A TIME.</text><g transform="translate(110 2690)"><rect x="0" y="0" width="16" height="16" rx="3" fill="#176B35"/><rect x="22" y="0" width="16" height="16" rx="3" fill="#0D321D"/><rect x="44" y="0" width="16" height="16" rx="3" fill="#39B85A"/><rect x="66" y="0" width="16" height="16" rx="3" fill="#14592D"/><rect x="88" y="0" width="16" height="16" rx="3" fill="#0A2918"/><rect x="110" y="0" width="16" height="16" rx="3" fill="#2FA94F"/><rect x="132" y="0" width="16" height="16" rx="3" fill="#51C96A"/><rect x="0" y="22" width="16" height="16" rx="3" fill="#14592D"/><rect x="22" y="22" width="16" height="16" rx="3" fill="#0B2E1A"/><rect x="44" y="22" width="16" height="16" rx="3" fill="#1F823F"/><rect x="66" y="22" width="16" height="16" rx="3" fill="#0D321D"/><rect x="88" y="22" width="16" height="16" rx="3" fill="#A3E635"/><rect x="110" y="22" width="16" height="16" rx="3" fill="#14592D"/><rect x="132" y="22" width="16" height="16" rx="3" fill="#0A2918"/><rect x="0" y="44" wid