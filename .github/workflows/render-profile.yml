name: Render profile SVG

on:
  push:
    paths:
      - 'tools/render-profile.py'
      - '.github/workflows/render-profile.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Render SVG
        run: python3 tools/render-profile.py
      - name: Commit generated profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-forest.svg
          git diff --cached --quiet && exit 0
          git commit -m 'chore: render github-compatible profile SVG [skip ci]'
          git push
